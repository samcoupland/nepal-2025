<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:title" content="Nepal Fundraiser 2025">
    <meta property="og:description" content="Raising money for rural Nepali villages and a local church in Pokhara">
    <meta property="og:image" content="">
    <meta property="og:url" content="https://samcoupland.com/nepal-2025/">
    <link rel="stylesheet" type="text/css" href="styles.css">
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <title>Nepal Fundraiser 2025</title>
</head>
<body>
    <div class="container">
        <button class="donate-btn" onclick="handleDonation()">DONATE</button>
        
        <div class="raised-section">
            <div class="raised-text">WE HAVE RAISED</div>
            <div class="amount" id="currentAmount">£0</div>
            
            <div class="progress-container">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            
            <div class="target-info">
                <span id="progressText">£0 of £2,500 target</span> • <span id="percentageText">0%</span>
            </div>
            
            <div class="thank-you">Thank you</div>
        </div>

        <div class="info-section">
            <div class="info-header">What we are raising for</div>
            
            <div class="info-box nepal" onclick="showInfo('nepal')">
                PICTURE of NEPAL<br>
                <small>The details of the event</small>
            </div>
            
            <div class="info-box village" onclick="showInfo('village')">
                PICTURE<br>
                Village
            </div>
            
            <div class="church-info">
                Working with<br>
                Family Church<br>
                (Empower Global)<br>
                gift aid
            </div>
            
            <div class="info-box cycling" onclick="showInfo('cycling')">
                PICTURE<br>
                Cycling
            </div>
        </div>

        <button class="donate-btn bottom-donate" onclick="handleDonation()">DONATE</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
